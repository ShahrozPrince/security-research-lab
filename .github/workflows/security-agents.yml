
name: Security Research Agents

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  offline-security-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Run 15 offline security checks
        run: python3 security_agents.py

      - name: Save security reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: security-agent-reports
          path: agent-reports/
