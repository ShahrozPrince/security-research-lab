
name: Security Research Agents

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  offline-security-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run 15 offline security checks
        run: python3 security_agents.py

      - name: Save security reports
        uses: actions/upload-artifact@v4
        with:
          name: security-agent-reports
          path: agent-reports/
