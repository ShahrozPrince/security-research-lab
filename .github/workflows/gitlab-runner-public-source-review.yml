name: GitLab Runner Public Source Review

# Read-only public source review plus local static-results triage.
on:
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'

permissions:
  contents: read

concurrency:
  group: gitlab-runner-public-review
  cancel-in-progress: false

jobs:
  review-public-go-source:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SEMGREP_SEND_METRICS: 'off'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - name: Checkout private-safe triage tool from this repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Test findings parser locally on synthetic data
        run: python -m unittest discover -s tests -p test_finding_investigation_engine.py -q

      - name: Fetch GitLab Runner public source (read-only, sparse)
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --filter=blob:none --sparse \
            https://gitlab.com/gitlab-org/gitlab-runner.git "$RUNNER_TEMP/gitlab-runner"
          git -C "$RUNNER_TEMP/gitlab-runner" sparse-checkout set commands executors
          echo "Reviewed public source commit:"
          git -C "$RUNNER_TEMP/gitlab-runner" rev-parse HEAD
          test -d "$RUNNER_TEMP/gitlab-runner/commands"
          test -d "$RUNNER_TEMP/gitlab-runner/executors"

      - name: Install known working Semgrep version
        run: python -m pip install 'semgrep==1.185.0'

      - name: Scan public source and automatically classify findings
        shell: bash
        run: |
          set -euo pipefail
          trap 'rm -f "$RUNNER_TEMP/source-review.json"' EXIT
          # No external website is probed. Detailed leads stay in temporary runner storage.
          semgrep scan --config p/default --metrics off --quiet --json \
            --output "$RUNNER_TEMP/source-review.json" \
            "$RUNNER_TEMP/gitlab-runner/commands" \
            "$RUNNER_TEMP/gitlab-runner/executors"
          python finding_investigation_engine.py --input "$RUNNER_TEMP/source-review.json"
          echo "No vulnerabilities independently verified."
          echo "No detailed findings saved in public logs or artifacts."

      - name: Confidentiality reminder
        if: always()
        run: |
          echo "Only PUBLIC source code reviewed; no production website probed."
          echo "Static rule matches are UNVERIFIED, not bounty claims."
