name: Advanced Security Toolchain

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: read

jobs:
  offline-research:
    name: 15 local modules and property tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install offline testing libraries
        run: python -m pip install 'pytest>=8,<10' 'hypothesis==6.170.15'
      - name: Run 15 existing checks
        run: python security_agents.py --root . --output tool-reports/local
      - name: Run property-based tests
        run: python -m pytest -q tests/test_security_properties.py
      - name: Preserve reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: advanced-offline-report
          path: tool-reports/
          if-no-files-found: warn
          retention-days: 7

  codeql:
    name: CodeQL Python security-extended
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Initialize CodeQL
        uses: github/codeql-action/init@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          languages: python
          build-mode: none
          queries: security-extended
      - name: Analyze Python
        uses: github/codeql-action/analyze@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2

  trivy:
    name: Trivy filesystem and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Create report directory
        run: mkdir -p tool-reports
      - name: Run Trivy repository checks
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: CRITICAL,HIGH,MEDIUM
          format: json
          output: tool-reports/trivy.json
          exit-code: '0'
      - name: Preserve report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: advanced-trivy-report
          path: tool-reports/trivy.json
          if-no-files-found: warn
          retention-days: 7

  osv-scanner:
    name: OSV dependency advisory scanner
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
    permissions:
      contents: read
      actions: read
      security-events: write
    with:
      fail-on-vuln: false
      scan-args: |-
        --recursive
        ./
