name: Finding Investigation Engine (Private-safe Triage)

# Start manually to validate upgrade before integrating with the existing hourly workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  investigate-public-source:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SEMGREP_SEND_METRICS: 'off'
    steps:
      - name: Checkout our local triage engine
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Test investigation parser on synthetic data
        run: python -m unittest discover -s tests -p test_finding_investigation_engine.py -v
      - name: Fetch public GitLab Runner source only
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --filter=blob:none --sparse \
            https://gitlab.com/gitlab-org/gitlab-runner.git "$RUNNER_TEMP/gitlab-runner"
          git -C "$RUNNER_TEMP/gitlab-runner" sparse-checkout set commands executors
          test -d "$RUNNER_TEMP/gitlab-runner/commands"
          test -d "$RUNNER_TEMP/gitlab-runner/executors"
      - name: Install Semgrep
        run: python -m pip install 'semgrep==1.185.0'
      - name: Scan public source into temporary runner storage
        shell: bash
        run: |
          set -euo pipefail
          semgrep scan --config p/default --metrics off --quiet --json \
            --output "$RUNNER_TEMP/source-review.json" \
            "$RUNNER_TEMP/gitlab-runner/commands" \
            "$RUNNER_TEMP/gitlab-runner/executors"
      - name: Classify and deduplicate without exposing private leads
        shell: bash
        run: |
          set -euo pipefail
          python finding_investigation_engine.py --input "$RUNNER_TEMP/source-review.json"
          rm -f "$RUNNER_TEMP/source-review.json"
      - name: Reminder
        if: always()
        run: |
          echo 'Only public source code reviewed; no production website probed.'
          echo 'No candidate has been independently reproduced or verified as bounty-eligible.'
          echo 'No detailed findings were saved to public artifacts.'
