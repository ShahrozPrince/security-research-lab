name: Security Agents (Offline Review)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * 1'

permissions:
  contents: read

jobs:
  offline-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Run fifteen offline review modules
        run: python security_agents.py --output agent-reports
      - name: Show findings in Actions summary
        if: always()
        shell: bash
        run: |
          if [ -f agent-reports/report.md ]; then
            cat agent-reports/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No report generated: check logs.' >> "$GITHUB_STEP_SUMMARY"
          fi
